<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Ball</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="/app.js" defer></script>
  </head>
  <body>
    <!-- 悬浮球 -->
    <div id="ball" class="ball">
      <span class="ball-icon">✨</span>
    </div>

    <!-- 对话面板 -->
    <div id="panel" class="panel hidden">
      <div class="panel-header">
        <span class="panel-title">AI Assistant</span>
        <div class="panel-actions">
          <button id="btn-settings" class="icon-btn" title="设置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
            </svg>
          </button>
          <button id="btn-clear" class="icon-btn" title="清空对话">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
          <button id="btn-close" class="icon-btn" title="关闭">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 消息列表 -->
      <div id="messages" class="messages"></div>

      <!-- 输入区域 -->
      <div class="input-area">
        <textarea id="input" placeholder="输入你的问题..." rows="1"></textarea>
        <button id="btn-send" class="send-btn" title="发送">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 设置面板 -->
    <div id="settings-panel" class="settings-panel hidden">
      <div class="panel-header">
        <span class="panel-title">设置</span>
        <button id="btn-settings-close" class="icon-btn" title="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="settings-body">
        <label>API URL</label>
        <input id="cfg-url" type="text" placeholder="https://api.openai.com/v1/chat/completions" />
        <label>API Key</label>
        <input id="cfg-key" type="password" placeholder="sk-..." />
        <label>Model</label>
        <input id="cfg-model" type="text" placeholder="gpt-3.5-turbo" />
        <button id="btn-save-config" class="save-btn">保存</button>
      </div>
    </div>
  </body>
</html>
